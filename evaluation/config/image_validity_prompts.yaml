  - id: pose_looking_behind
    category: pose
    original_phrase: "looking behind her"
    rendering_phrase: "looking backward"
    critical: false
    high_risk: false

# Prompt contexts for materializing audit and bakeoff designs. Each context is a
# template that receives the rendering_phrase as {property}.
contexts:
  - id: ctx_simple
    description: "Bare property phrase"
    template: "{property}"

  - id: ctx_descriptive
    description: "Property with article and subject"
    template: "A person {property}"

  - id: ctx_narrative
    description: "Property in a scene description"
    template: "A photograph of a person {property}, high quality, detailed"

  - id: ctx_direct
    description: "Direct imperative style"
    template: "Show {property}"

# Prompt audit design: test all 26 properties with 2 contexts and 2 seeds to verify
# that rendering phrases are unambiguous and models can generate valid targets.
audit_design:
  seeds: [42, 100]
  context_ids: [ctx_simple, ctx_descriptive]

# Bakeoff design: 12 frozen high-risk properties across 4 contexts, 4 seeds, and 3 models
# for the native model qualification gate (90% observed validity required).
bakeoff_design:
  # exactly 12 high-risk properties frozen for the bakeoff
  property_ids:
    - hair_blond
    - hair_brunette
    - eyes_blue
    - situation_walking_rain
    - situation_horseback_plain
    - situation_driving_blue_car
    - situation_driving_red_car
    - tshirt_blue
    - tshirt_red
    - hat_baseball_cap
    - action_holding_coffee
    - action_holding_cocacola
  seeds: [42, 100, 200, 300]
  context_ids: [ctx_simple, ctx_descriptive, ctx_narrative, ctx_direct]
  model_backbones: [sd35_large_turbo, sd35_large, flux_dev]
